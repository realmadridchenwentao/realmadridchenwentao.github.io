cudabench2026:
  title: "CUDABench: Benchmarking LLMs for Text-to-CUDA Generation"
  abstract: "<p>
  Recent studies have demonstrated the potential of Large Language Models (LLMs) in generating GPU Kernels. Current benchmarks focus on the translation of high-level languages into CUDA, overlooking the more general and challenging task of text-to-CUDA generation. Furthermore, given the hardware-specific and performance-critical features of GPU programming, accurately assessing the performance of LLM-generated GPU programs is nontrivial. In this work, we introduce CUDABench, a comprehensive benchmark designed to evaluate the text-to-CUDA capabilities of LLMs. First, we construct CUDABench-Set, which covers Breadth-Depth-Difficulty evaluation space in diverse application domains, including artificial intelligence, scientific computing, and data analytics, etc. Furthermore, we propose CUDABench-Score and Generative Verification Pipeline that assess (1) compilation correctness, (2) functional consistency through execution-based verification, and (3) a novel roofline-based metric, Performance-Score. Benchmarking state-of-the-art LLMs reveals insightful findings and challenges of text-to-CUDA, such as a notable mismatch between high compilation success rates and low functional correctness, a lack of domain-specific algorithmic knowledge, and suboptimal utilization of GPU hardware resources. Our benchmark is available at [https://github.com/CUDA-Bench/CUDABench](https://github.com/CUDA-Bench/CUDABench).
  </p>"
  venue: "Preprint"
  year: 2026
  pdf: /publications/cudabench2026.pdf
  authors:
    - jiacezhu
    - wentaochen
    - qifan
    - zhixingren
    - junyingwu
    - xingzhe
    - boom
    - yehanma
    - anzou

task-based-iacnn2026:
  title: "Medical Image Denoising with Task-based Image-adaptive Denoising CNN"
  abstract: "<p>
  Image denoising is a fundamental inverse problem in medical imaging. Traditional sparsity-promoting approaches, such as penalized least-squares (PLS) with total variation (TV), have been widely employed to address such inverse problems. However, the handcrafted regularizers used in these methods cannot fully model complex image statistics, often leading to suboptimal image quality (IQ) performance. Supervised learning-based methods employing convolutional neural networks (CNNs) have emerged as powerful denoising approaches that can capture complex image statistics and improve IQ. However, CNNs trained with loss functions based solely on traditional IQ measures may remove subtle image details that are critical for task performance (e.g., tumor detection accuracy), resulting in degraded task-based IQ measures. In this work, we propose a novel task-based image-adaptive strategy to fine-tune the pre-trained CNN denoiser for each individual image by further promoting data fidelity while penalizing deviations in test statistics of a model observer for classification tasks. Numerical studies involving a stochastic binary texture model are conducted, and it is demonstrated that the proposed method achieves substantial improvements compared to previous medical image denoising methods in both traditional and task-based IQ metrics.
  </p>"
  venue: "Medical Imaging 2026: Image Perception, Observer Performance, and Technology Assessment"
  year: 2026
  pdf: /publications/task-based-iacnn2026.pdf
  authors:
    - wentaochen
    - weiminzhou

ddtm2026:
  title: "Diffusion Models with Awareness of Binary Signal Detection Tasks for Medical Image Denoising"
  abstract: "<p>
  It is widely recognized that the evaluation and optimization of medical imaging system performance should be guided by task-based measures of image quality (IQ). We propose a task-aware diffusion model (TADM), a sampling-based method that incorporates channelized model observers, to denoise medical images for binary signal detection tasks. Our study employs Partial Least Squares (PLS) channels and uses singular value decomposition (SVD) to decompose the image into task-dense and task-sparse components. During the denoising process, TADMs simultaneously reduce noise in both task-dense and task-sparse components via corresponding posterior sampling. It is demonstrated that the proposed TADMs outperform Denoising Diffusion Restoration Models (DDRMs) in both physical IQ metrics (e.g. PSNR and FID) and task-based IQ metrics across a variety of image noise levels and datasets.
  </p>"
  venue: "Medical Imaging 2026: Image Perception, Observer Performance, and Technology Assessment"
  year: 2026
  pdf: /publications/ddtm2026.pdf
  authors:
    - yaozhizhang
    - wentaochen
    - weiminzhou
    - yangliu

cuda-llm2025:
  title: "CUDA-LLM: LLMs Can Write Efficient CUDA Kernels"
  abstract: "<p>
  Large Language Models (LLMs) have demonstrated strong capabilities in general-purpose code generation. However, generating the code which is deeply hardware-specific, architecture-aware, and performance-critical, especially for massively parallel GPUs, remains a complex challenge. In this work, we explore the use of LLMs for the automated generation and optimization of CUDA programs, with the goal of producing high-performance GPU kernels that fully exploit the underlying hardware. To address this challenge, we propose a novel framework called \\textbf{Feature Search and Reinforcement (FSR)}. FSR jointly optimizes compilation and functional correctness, as well as the runtime performance, which are validated through extensive and diverse test cases, and measured by actual kernel execution latency on the target GPU, respectively. This approach enables LLMs not only to generate syntactically and semantically correct CUDA code but also to iteratively refine it for efficiency, tailored to the characteristics of the GPU architecture. We evaluate FSR on representative CUDA kernels, covering AI workloads and computational intensive algorithms. Our results show that LLMs augmented with FSR consistently guarantee correctness rates. Meanwhile, the automatically generated kernels can outperform general human-written code by a factor of up to 179$\\times$ in execution speeds. These findings highlight the potential of combining LLMs with performance reinforcement to automate GPU programming for hardware-specific, architecture-sensitive, and performance-critical applications.
  </p>"
  venue: "Preprint"
  year: 2025
  pdf: /publications/cuda-llm2025.pdf
  authors:
    - wentaochen
    - jiacezhu
    - qifan
    - yehanma
    - anzou

addgan2025:
  title: "Ambient Denoising Diffusion Generative Adversarial Networks for Establishing Stochastic Object Models from Noisy Image Data"
  abstract: "<p>
  It is widely accepted that medical imaging systems should be objectively assessed via task-based image quality (IQ) measures that ideally account for all sources of randomness in the measured image data, including the variation in the ensemble of objects to be imaged. Stochastic object models (SOMs) that can randomly draw samples from the object distribution can be employed to characterize object variability. To establish realistic SOMs for task-based IQ analysis, it is desirable to employ experimental image data. However, experimental image data acquired from medical imaging systems are subject to measurement noise. Previous work investigated the ability of deep generative models (DGMs) that employ an augmented generative adversarial network (GAN), AmbientGAN, for establishing SOMs from noisy measured image data. Recently, denoising diffusion models (DDMs) have emerged as a leading DGM for image synthesis and can produce superior image quality than GANs. However, original DDMs possess a slow image-generation process because of the Gaussian assumption in the denoising steps. More recently, denoising diffusion GAN (DDGAN) was proposed to permit fast image generation while maintain high generated image quality that is comparable to the original DDMs. In this work, we propose an augmented DDGAN architecture, Ambient DDGAN (ADDGAN), for learning SOMs from noisy image data. Numerical studies that consider clinical computed tomography (CT) images and digital breast tomosynthesis (DBT) images are conducted. The ability of the proposed ADDGAN to learn realistic SOMs from noisy image data is demonstrated. It has been shown that the ADDGAN significantly outperforms the advanced AmbientGAN models for synthesizing high resolution medical images with complex textures.
  </p>"
  venue: "Medical Imaging 2025: Image Perception, Observer Performance, and Technology Assessment"
  year: 2025
  pdf: /publications/addgan2025.pdf
  authors:
    - xichenxu
    - wentaochen
    - weiminzhou

task-based-pls-tv2025:
  title: "Task-based Regularization in Penalized Least-Squares for Binary Signal Detection Tasks in Medical Image Denoising"
  abstract: "<p>
  Image denoising algorithms have been extensively investigated for medical imaging. To perform image denoising, penalized least-squares (PLS) problems can be designed and solved, in which the penalty term encodes prior knowledge of the object being imaged. Sparsity-promoting penalties, such as total variation (TV), have been a popular choice for regularizing image denoising problems. However, such hand-crafted penalties may not be able to preserve task-relevant information in measured image data and can lead to oversmoothed image appearances and patchy artifacts that degrade signal detectability. Supervised learning methods that employ convolutional neural networks (CNNs) have emerged as a popular approach to denoising medical images. However, studies have shown that CNNs trained with loss functions based on traditional image quality measures can lead to a loss of task-relevant information in images. Some previous works have investigated task-based loss functions that employ model observers for training the CNN denoising models. However, such training processes typically require a large number of noisy and ground-truth (noise-free or low-noise) image data pairs. In this work, we propose a task-based regularization strategy for use with PLS in medical image denoising. The proposed task-based regularization is associated with the likelihood of linear test statistics of noisy images for Gaussian noise models. The proposed method does not require ground-truth image data and solves an individual optimization problem for denoising each image. Computer-simulation studies are conducted that consider a multivariate-normally distributed (MVN) lumpy background and a binary texture background. It is demonstrated that the proposed regularization strategy can effectively improve signal detectability in denoised images.
  </p>"
  venue: "Medical Imaging 2025: Image Perception, Observer Performance, and Technology Assessment"
  year: 2025
  pdf: /publications/task-based-pls-tv2025.pdf
  authors:
    - wentaochen
    - tianmingxu
    - weiminzhou

